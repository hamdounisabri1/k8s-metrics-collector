apiVersion: v1
kind: ServiceAccount
metadata:
  name: collector-sa
  namespace: k8s-metrics

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: collector-role

rules:
- apiGroups: [""]
  resources: ["pods","persistentvolumeclaims"]
  verbs: ["get","list","watch"]

- apiGroups: ["metrics.k8s.io"]
  resources: ["pods"]
  verbs: ["get","list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: collector-binding

subjects:
- kind: ServiceAccount
  name: collector-sa
  namespace: k8s-metrics

roleRef:
  kind: ClusterRole
  name: collector-role
  apiGroup: rbac.authorization.k8s.io
